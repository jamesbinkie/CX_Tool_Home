<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Triangle Generator</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Warning Box Styling: Dark background with thick orange outline */
    .warning-box {
      display: none;
      background: #313338; 
      color: #f2f3f5;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 600;
      border: 4px solid #f39c12;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #abc-controls, #wh-controls { display: none; }
    .range { font-size: 11px; color: #009fe3; margin-top: 4px; }
  </style>
</head>

<body>

<div class="nav-header">
  <button onclick="window.location.href='../index.html'" style="background: #4f545c;">← Back to Home</button>
</div>

<div class="container">
  <h2>Triangle Generator (mm)</h2>

  <div id="safetyWarning" class="warning-box">
    ⚠️ Corner angle is less than 30°: Too tight for edge banding!
  </div>

  <div id="sheetWarning" class="warning-box">
    ⚠️ Part exceeds maximum sheet size (2400 x 1200 mm).
  </div>

  <div class="controls panel">
    <label>Type:
      <select id="type">
        <option value="right">Right triangle</option>
        <option value="left">Left Triangle</option>
        <option value="standard">Triangle</option>
      </select>
    </label>

    <div id="wh-controls" style="display: flex; gap: 20px;">
        <label>Width (W):
            <input id="W" type="number" value="500" onclick="this.select()">
            <div class="range" id="rangeW">Min 200 mm — Max 2400 mm</div>
        </label>
        <label>Height (H):
            <input id="H" type="number" value="500" onclick="this.select()">
            <div class="range" id="rangeH">Min 200 mm — Max 2400 mm</div>
        </label>
    </div>

    <div id="standard-toggle-wrap" style="display: none; align-items: center; padding-top: 25px;">
        <label style="flex-direction: row; align-items: center; min-width: auto; gap: 10px;">
            <input type="checkbox" id="isSymmetric" checked> Symmetric
        </label>
    </div>

    <div id="abc-controls" style="display: none; gap: 20px;">
        <label>Side A (Left): 
            <input id="sideA" type="number" value="500" onclick="this.select()">
            <div class="range">Min 200 mm</div>
        </label>
        <label>Side B (Right): 
            <input id="sideB" type="number" value="500" onclick="this.select()">
            <div class="range">Min 200 mm</div>
        </label>
        <label>Side C (Bottom): 
            <input id="sideC" type="number" value="600" onclick="this.select()">
            <div class="range">Max 2400 mm</div>
        </label>
    </div>
  </div>

  <h3>Edge Banding</h3>
  <div class="edge-controls panel">
    <label><input type="checkbox" id="bandBottom"> Bottom</label>
    <label><input type="checkbox" id="bandRight"> Right</label>
    <label><input type="checkbox" id="bandLeft"> Left</label>
  </div>

  <h3>Export</h3>
  <div class="file-controls panel" style="display: flex; align-items: flex-end; gap: 20px;">
    <label>File Name:
      <input id="fileName" type="text" value="triangle">
    </label>
    <button onclick="downloadPNG()">Download PNG</button>
    <button onclick="downloadDXF()">Download DXF</button>
  </div>

  <canvas id="canvas" width="900" height="600"></canvas>
</div>

<div id="versionLabel">v2.5.1</div>

<script src="script.js"></script>

</body>
</html>
