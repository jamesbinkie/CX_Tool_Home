<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Triangle Generator</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .warning-box {
      display: none;
      background: #ff4444;
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    #abc-controls, #wh-controls { display: none; }
  </style>
</head>

<body>

<div class="nav-header">
  <button onclick="window.location.href='../index.html'" style="background: #4f545c;">← Back to Home</button>
</div>

<div class="container">
  <h2>Triangle Generator (mm)</h2>

  <div id="safetyWarning" class="warning-box">
    ⚠️ Corner angle is less than 30°: Too tight for edge banding!
  </div>

  <div class="controls panel">
    <label>Type:
      <select id="type">
        <option value="right">Right Angle</option>
        <option value="left">Left Hand</option>
        <option value="standard">Standard</option>
      </select>
    </label>

    <div id="wh-controls" style="display: flex; gap: 20px;">
        <label>Width:
            <input id="W" type="number" value="500" min="50" onclick="this.select()">
        </label>
        <label>Height:
            <input id="H" type="number" value="400" min="50" onclick="this.select()">
        </label>
    </div>

    <div id="standard-toggle-wrap" style="display: none; align-items: center; padding-top: 25px;">
        <label style="flex-direction: row; align-items: center; min-width: auto; gap: 10px;">
            <input type="checkbox" id="isSymmetric" checked> Symmetric
        </label>
    </div>

    <div id="abc-controls" style="display: none; gap: 20px;">
        <label>Side A: <input id="sideA" type="number" value="500" onclick="this.select()"></label>
        <label>Side B: <input id="sideB" type="number" value="500" onclick="this.select()"></label>
        <label>Side C (Base): <input id="sideC" type="number" value="600" onclick="this.select()"></label>
    </div>
  </div>

  <h3>Edge Banding</h3>
  <div class="edge-controls panel">
    <label><input type="checkbox" id="band1"> Side 1</label>
    <label><input type="checkbox" id="band2"> Side 2</label>
    <label><input type="checkbox" id="band3"> Side 3</label>
  </div>

  <h3>Export</h3>
  <div class="file-controls panel" style="display: flex; align-items: flex-end; gap: 20px;">
    <label>File Name:
      <input id="fileName" type="text" value="triangle">
    </label>
    <button onclick="downloadPNG()">Download PNG</button>
    <button onclick="downloadDXF()">Download DXF</button>
  </div>

  <canvas id="canvas" width="900" height="600"></canvas>
</div>

<div id="versionLabel">v2.0.0</div>

<script src="script.js"></script>
</body>
</html>
