<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>L-Shape Generator</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .warning-box { display: none; background: #313338; color: #f2f3f5; padding: 15px; border-radius: 10px; font-weight: 600; border: 4px solid #f39c12; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    #radiusWarning { border-color: #e74c3c; }
    .corner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px 20px; }
    .corner-input-wrap { display: flex; flex-direction: column; }
    .corner-input-wrap label { font-size: 12px; color: #b5bac1; margin-bottom: 5px; font-weight: bold; min-width: auto; }
    .corner-input-wrap input:focus { border-color: #009fe3; outline: none; }
    .inner-corner-box input { border-color: #009fe3 !important; box-shadow: 0 0 8px rgba(0,159,227,0.3); }
    .inner-corner-box label { color: #009fe3; }
  </style>
</head>
<body>
<div class="nav-header">
  <button onclick="window.location.href='../index.html'" style="background: #4f545c;">  Back to Home</button>
</div>
<div class="container">
  <h2>L-Shape Generator (mm)</h2>
  <div id="sheetWarning" class="warning-box"></div>
  <div id="radiusWarning" class="warning-box"></div>
  <div class="main-layout">
      <div class="left-col">
        <div class="file-controls panel">
            <h3>Export Part</h3>
            <div style="display: flex; align-items: flex-end; gap: 15px; flex-wrap: wrap;">
                <label style="flex: 1; min-width: 150px;">File Name: <input id="fileName" type="text" value="l_shape" style="width: 100%;"></label>
                <button onclick="downloadPNG()">Download PNG</button>
                <button onclick="downloadDXF()">Download DXF</button>
            </div>
        </div>
        <canvas id="canvas"></canvas>
      </div>
      <div class="right-col">
          <div class="controls panel">
            <div style="display: flex; align-items: center; border-bottom: 1px solid #4f545c; margin-bottom: 15px; padding-bottom: 8px;">
                <h3 style="margin: 0; border: none; padding-bottom: 0;">Dimensions & Orientation</h3>
                <button onclick="rotatePart()" style="margin-left: auto; padding: 6px 12px; font-size: 12px; background: #009fe3; color: white; border: none; border-radius: 4px; cursor: pointer;">Rotate 90°</button>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 15px 25px;">
                <label class="full-width">Orientation:<select id="type"><option value="right">Right L</option><option value="left">Left L</option></select></label>
                <label>Total Width (A):<input id="totalW" type="number" value="1000" onclick="this.select()"><div class="range" id="rangeA">Min 200   Max 3050 mm</div></label>
                <label>Total Height (B):<input id="totalH" type="number" value="800" onclick="this.select()"><div class="range" id="rangeB">Min 200   Max 3050 mm</div></label>
                <label>Top Leg Width (C):<input id="legW" type="number" value="300" onclick="this.select()"><div class="range" id="rangeC">Min 200 mm</div></label>
                <label>Bottom Leg Height (D):<input id="legH" type="number" value="300" onclick="this.select()"><div class="range" id="rangeD">Min 200 mm</div></label>
            </div>
          </div>
          <div class="panel">
            <h3>Corner Radii</h3>
            <p style="font-size: 11px; color: #b5bac1; margin-top: -5px; margin-bottom: 12px;">Hover to highlight on diagram. Corner 4 is the Internal radius.</p>
            <div class="corner-grid">
                <div class="corner-input-wrap inner-corner-box" data-corner="3"><label>Corner 4 (Internal)</label><input type="number" id="rad3" value="50" min="50"></div>
                <div class="corner-input-wrap" data-corner="0"><label>Corner 1 (Btm L)</label><input type="number" id="rad0" value="0"></div>
                <div class="corner-input-wrap" data-corner="1"><label>Corner 2 (Btm R)</label><input type="number" id="rad1" value="0"></div>
                <div class="corner-input-wrap" data-corner="2"><label>Corner 3 (Mid R)</label><input type="number" id="rad2" value="0"></div>
                <div class="corner-input-wrap" data-corner="4"><label>Corner 5 (Top R)</label><input type="number" id="rad4" value="0"></div>
                <div class="corner-input-wrap" data-corner="5"><label>Corner 6 (Top L)</label><input type="number" id="rad5" value="0"></div>
            </div>
          </div>
          <div class="edge-controls panel">
            <h3>Edge Banding</h3>
            <div id="dynamic-banding-controls" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 15px; align-items: center;"></div>
          </div>
      </div>
  </div>
</div>
<div id="versionLabel">v4.2.1</div>
<script src="script.js"></script>
</body>
</html>
