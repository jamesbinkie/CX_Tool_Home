<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>L-Shape Generator</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .warning-box {
      display: none;
      background: #313338;
      color: #f2f3f5;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 600;
      border: 4px solid #f39c12;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .corner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .corner-input-wrap {
      display: flex;
      flex-direction: column;
      background: #1e1f22;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .corner-input-wrap:hover { border-color: #009fe3; }
    .corner-input-wrap label { font-size: 12px; color: #b5bac1; margin-bottom: 5px; min-width: auto; }
    
    /* FIX: Set explicit text color for inputs */
    .corner-input-wrap input { 
      margin-top: 0; 
      width: 100%; 
      border: none; 
      background: transparent; 
      padding: 5px 0; 
      color: #f2f3f5; 
      font-size: 15px;
      font-weight: 600;
    }
    .corner-input-wrap input:focus { outline: none; }

    .range { font-size: 11px; color: #009fe3; margin-top: 4px; font-weight: normal; }
    .inner-corner { border: 2px solid #009fe3; background: #2c2f33; }
  </style>
</head>

<body>

<div class="nav-header">
  <button onclick="window.location.href='../index.html'" style="background: #4f545c;">← Back to Home</button>
</div>

<div class="container">
  <h2>L-Shape Generator (mm)</h2>

  <div id="sheetWarning" class="warning-box">
    ⚠️ Part exceeds maximum sheet size (2400 x 1200 mm).
  </div>

  <div class="controls panel">
    <label>Orientation:
      <select id="type">
        <option value="right">Right L</option>
        <option value="left">Left L</option>
      </select>
    </label>

    <label>Total Width (A):
        <input id="totalW" type="number" value="1000" onclick="this.select()">
        <div class="range">Min 200 — Max 2400 mm</div>
    </label>
    <label>Total Height (B):
        <input id="totalH" type="number" value="800" onclick="this.select()">
        <div class="range">Min 200 — Max 2400 mm</div>
    </label>
    <label>Top Leg Width (C):
        <input id="legW" type="number" value="300" onclick="this.select()">
        <div class="range">Min 200 mm</div>
    </label>
    <label>Bottom Leg Height (D):
        <input id="legH" type="number" value="300" onclick="this.select()">
        <div class="range">Min 200 mm</div>
    </label>
  </div>

  <div class="panel">
    <h3>Corner Radii</h3>
    <p style="font-size: 12px; color: #b5bac1; margin-bottom: 10px;">Hover to highlight the corner. Corner 4 is the internal radius (Min 50mm).</p>
    <div class="corner-grid">
        <div class="corner-input-wrap" data-corner="0"><label>Corner 1 (Outer)</label><input type="number" id="rad0" value="0"></div>
        <div class="corner-input-wrap" data-corner="1"><label>Corner 2 (Outer)</label><input type="number" id="rad1" value="0"></div>
        <div class="corner-input-wrap" data-corner="2"><label>Corner 3 (Outer)</label><input type="number" id="rad2" value="0"></div>
        <div class="corner-input-wrap inner-corner" data-corner="3"><label>Corner 4 (Inner)</label><input type="number" id="rad3" value="50"></div>
        <div class="corner-input-wrap" data-corner="4"><label>Corner 5 (Outer)</label><input type="number" id="rad4" value="0"></div>
        <div class="corner-input-wrap" data-corner="5"><label>Corner 6 (Outer)</label><input type="number" id="rad5" value="0"></div>
    </div>
  </div>

  <h3>Edge Banding</h3>
  <div class="edge-controls panel">
    <label><input type="checkbox" id="bandBottom"> Bottom (A)</label>
    <label><input type="checkbox" id="bandLeft"> Left (B)</label>
    <label><input type="checkbox" id="bandTop"> Top (C)</label>
    <label><input type="checkbox" id="bandOuterLeg"> Outer Leg (D)</label>
    <label><input type="checkbox" id="bandInnerH"> Inner Horiz</label>
    <label><input type="checkbox" id="bandInnerV"> Inner Vert</label>
  </div>

  <h3>Export</h3>
  <div class="file-controls panel" style="display: flex; align-items: flex-end; gap: 20px;">
    <label>File Name: <input id="fileName" type="text" value="l_shape"></label>
    <button onclick="downloadPNG()">Download PNG</button>
    <button onclick="downloadDXF()">Download DXF</button>
  </div>

  <canvas id="canvas" width="900" height="600"></canvas>
</div>

<div id="versionLabel">v2.7.2</div>

<script src="script.js"></script>
</body>
</html>
