<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>L-Shape Generator</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .warning-box {
      display: none;
      background: #313338;
      color: #f2f3f5;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 600;
      border: 4px solid #f39c12;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #radiusWarning { border-color: #e74c3c; }

    .corner-grid {
      display: grid;
      /* Spacing synchronized with main controls: 40px horizontal gap */
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 25px 40px; 
      margin-top: 15px;
    }
    
    .corner-input-wrap { display: flex; flex-direction: column; }
    .corner-input-wrap label { 
      font-size: 13px; 
      color: #b5bac1; 
      margin-bottom: 5px;
      font-weight: bold;
      min-width: auto;
    }

    /* FIX: Standardized box look with fixed padding and borders */
    .corner-input-wrap input { 
      width: 100%; 
      font-size: 15px;
      font-weight: 600;
      background: #1e1f22;
      border: 1px solid #1e1f22;
      color: #f2f3f5;
      border-radius: 6px;
      padding: 8px 12px;
      box-sizing: border-box;
    }
    .corner-input-wrap input:focus { border-color: #009fe3; outline: none; }
    .range { font-size: 11px; color: #009fe3; margin-top: 4px; font-weight: normal; }
    
    .inner-corner-box input { border-color: #009fe3 !important; box-shadow: 0 0 8px rgba(0,159,227,0.3); }
    .inner-corner-box label { color: #009fe3; }
  </style>
</head>

<body>

<div class="nav-header">
  <button onclick="window.location.href='../index.html'" style="background: #4f545c;">← Back to Home</button>
</div>

<div class="container">
  <h2>L-Shape Generator (mm)</h2>

  <div id="sheetWarning" class="warning-box">
    ⚠️ Part exceeds maximum sheet size (2400 x 1200 mm). Values have been adjusted to fit.
  </div>

  <div id="radiusWarning" class="warning-box">
    ⚠️ Radii are too large! They have been capped to fit the side length.
  </div>

  <div class="controls panel">
    <label>Orientation:
      <select id="type">
        <option value="right">Right L</option>
        <option value="left">Left L</option>
      </select>
    </label>

    <label>Total Width (A):
        <input id="totalW" type="number" value="1000" onclick="this.select()">
        <div class="range" id="rangeA">Min 200 — Max 2400 mm</div>
    </label>
    <label>Total Height (B):
        <input id="totalH" type="number" value="800" onclick="this.select()">
        <div class="range" id="rangeB">Min 200 — Max 2400 mm</div>
    </label>
    <label>Top Leg Width (C):
        <input id="legW" type="number" value="300" onclick="this.select()">
        <div class="range" id="rangeC">Min 200 mm</div>
    </label>
    <label>Bottom Leg Height (D):
        <input id="legH" type="number" value="300" onclick="this.select()">
        <div class="range" id="rangeD">Min 200 mm</div>
    </label>
  </div>

  <div class="panel">
    <h3>Corner Radii</h3>
    <p style="font-size: 12px; color: #b5bac1; margin-bottom: 10px;">Hover to highlight on diagram. Corner 4 is the Internal radius.</p>
    <div class="corner-grid">
        <div class="corner-input-wrap inner-corner-box" data-corner="3">
            <label for="rad3">Corner 4 (Internal)</label>
            <input type="number" id="rad3" value="50" min="50">
        </div>
        <div class="corner-input-wrap" data-corner="0">
            <label for="rad0">Corner 1</label>
            <input type="number" id="rad0" value="0">
        </div>
        <div class="corner-input-wrap" data-corner="1">
            <label for="rad1">Corner 2</label>
            <input type="number" id="rad1" value="0">
        </div>
        <div class="corner-input-wrap" data-corner="2">
            <label for="rad2">Corner 3</label>
            <input type="number" id="rad2" value="0">
        </div>
        <div class="corner-input-wrap" data-corner="4">
            <label for="rad4">Corner 5</label>
            <input type="number" id="rad4" value="0">
        </div>
        <div class="corner-input-wrap" data-corner="5">
            <label for="rad5">Corner 6</label>
            <input type="number" id="rad5" value="0">
        </div>
    </div>
  </div>

  <h3>Edge Banding</h3>
  <div class="edge-controls panel">
    <label><input type="checkbox" id="bandBottom"> Bottom (A)</label>
    <label><input type="checkbox" id="bandRight"> Right (D)</label>
    <label><input type="checkbox" id="bandInternal"> Internal</label>
    <label><input type="checkbox" id="bandTop"> Top (C)</label>
    <label><input type="checkbox" id="bandLeft"> Left (B)</label>
  </div>

  <h3>Export</h3>
  <div class="file-controls panel" style="display: flex; align-items: flex-end; gap: 20px;">
    <label>File Name: <input id="fileName" type="text" value="l_shape"></label>
    <button onclick="downloadPNG()">Download PNG</button>
    <button onclick="downloadDXF()">Download DXF</button>
  </div>

  <canvas id="canvas" width="900" height="600"></canvas>
</div>

<div id="versionLabel">v2.9.1</div>

<script src="script.js"></script>
</body>
</html>
