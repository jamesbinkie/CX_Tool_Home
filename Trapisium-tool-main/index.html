<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trapezium Generator</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<div class="nav-header">
  <button onclick="window.location.href='../index.html'" style="background: #4f545c;">← Back to Home</button>
</div>

<div class="landing-container" style="text-align: left; padding: 0;">
  <h2>Trapezium Generator (mm)</h2>

  <div class="controls panel">
    <label>Type:
      <select id="type">
        <option value="regular">Regular</option>
        <option value="right">Right</option>
        <option value="irregular">Irregular</option>
      </select>
    </label>

    <label>A (Height):
      <input id="A" type="number" value="500" min="100" max="2440" onclick="this.select()">
      <div class="range">Min 100 mm — Max 2440 mm</div>
    </label>

    <label>B (Bottom Width):
      <input id="B" type="number" value="500" min="50" max="2440" onclick="this.select()">
      <div class="range">Min 50 mm — Max 2440 mm</div>
    </label>

    <label>C (Top Width):
      <input id="C" type="number" value="200" min="20" onclick="this.select()">
      <div class="range">Min 20 mm — Max <span id="CmaxLabel">499</span> mm</div>
    </label>

    <label id="Dlabel">D (Offset):
      <input id="D" type="number" value="0" min="0" onclick="this.select()">
      <div class="range">0 mm — Max <span id="DmaxLabel">0</span> mm</div>
    </label>
  </div>

  <h3>Edge Banding</h3>
  <div class="edge-controls panel">
    <label><input type="checkbox" id="bandTop"> Top</label>
    <label><input type="checkbox" id="bandRight"> Right</label>
    <label><input type="checkbox" id="bandBottom"> Bottom</label>
    <label><input type="checkbox" id="bandLeft"> Left</label>
  </div>

  <h3>Export</h3>
  <div class="file-controls panel" style="display: flex; align-items: flex-end; gap: 20px;">
    <label>File Name:
      <input id="fileName" type="text" value="trapezium">
    </label>
    <button onclick="downloadPNG()">Download PNG</button>
    <button onclick="downloadDXF()">Download DXF</button>
  </div>

  <canvas id="canvas" width="900" height="600"></canvas>
</div>

<div id="versionLabel">v2.6.2</div>

<script src="script.js"></script>

<script>
  document.getElementById("Dlabel").style.display = "none";

  document.getElementById("type").addEventListener("change", function () {
    const type = this.value;
    const Dlabel = document.getElementById("Dlabel");
    Dlabel.style.display = (type === "irregular") ? "flex" : "none";
    drawTrapezium();
  });

  document.querySelectorAll("#bandTop, #bandRight, #bandBottom, #bandLeft")
    .forEach(cb => {
      cb.addEventListener("change", function () {
        drawTrapezium();
      });
    });
</script>

</body>
</html>
