<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trapezium Generator</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .warning-box { display: none; background: #313338; color: #f2f3f5; padding: 15px; border-radius: 10px; font-weight: 600; border: 4px solid #f39c12; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    #radiusWarning { border-color: #e74c3c; }
    .corner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px 20px; }
    .corner-input-wrap { display: flex; flex-direction: column; }
    .corner-input-wrap label { font-size: 12px; color: #b5bac1; margin-bottom: 5px; font-weight: bold; }
    .corner-input-wrap input:focus { border-color: #009fe3; outline: none; }
    .dim-wrap { transition: all 0.2s ease; padding: 4px; border-radius: 6px; }
    .dim-wrap:hover { background: rgba(0, 159, 227, 0.1); box-shadow: inset 0 0 0 1px #009fe3; }
  </style>
</head>
<body>
<div class="nav-header">
  <button onclick="window.location.href='../index.html'" style="background: #4f545c;">  Back to Home</button>
</div>
<div class="container">
  <h2>Trapezium Generator (mm)</h2>
  <div id="radiusWarning" class="warning-box"></div>
  <div class="main-layout">
    <div class="left-col">
      <div class="file-controls panel">
        <h3>Export Part</h3>
        <div style="display: flex; align-items: flex-end; gap: 15px; flex-wrap: wrap;">
          <label style="flex: 1; min-width: 150px;">File Name: <input id="fileName" type="text" value="trapezium" style="width: 100%;"></label>
          <button onclick="downloadPNG()">Download PNG</button>
          <button onclick="downloadDXF()">Download DXF</button>
        </div>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <div class="right-col">
      <div class="controls panel">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid #4f545c; margin-bottom: 15px; padding-bottom: 8px;">
            <h3 style="margin: 0; border: none; padding-bottom: 0;">Dimensions</h3>
            <button onclick="rotatePart()" style="margin-left: auto; padding: 6px 12px; font-size: 12px; background: #009fe3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Rotate 90°</button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 15px 25px;">
          <label class="full-width">Type:
            <select id="type">
                <option value="regular">Regular</option>
                <option value="right">Right</option>
                <option value="left">Left</option>
                <option value="irregular">Irregular</option>
            </select>
          </label>
          <label class="dim-wrap" data-dim="A"><span id="labelA">A (Height):</span><input id="A" type="number" value="500" min="100" max="3050" onclick="this.select()"><div class="range">Min 100 mm   Max 3050 mm</div></label>
          <label class="dim-wrap" data-dim="B"><span id="labelB">B (Bottom Width):</span><input id="B" type="number" value="500" min="50" max="3050" onclick="this.select()"><div class="range">Min 50 mm   Max 3050 mm</div></label>
          <label class="dim-wrap" data-dim="C"><span id="labelC">C (Top Width):</span><input id="C" type="number" value="200" min="20" onclick="this.select()"><div class="range">Min 20 mm   Max <span id="CmaxLabel">499</span> mm</div></label>
          <label class="dim-wrap" data-dim="D" id="DlabelWrap"><span id="labelD">D (Offset):</span><input id="D" type="number" value="0" min="0" onclick="this.select()"><div class="range">0 mm   Max <span id="DmaxLabel">0</span> mm</div></label>
        </div>
      </div>
      <div class="panel">
        <h3>Corner Radii</h3>
        <p style="font-size: 11px; color: #b5bac1; margin-top: -5px; margin-bottom: 12px;">Hover to highlight on diagram. Min 50mm if banding flows through.</p>
        <div class="corner-grid">
            <div class="corner-input-wrap" data-corner="0"><label>Corner 1 (Btm L)</label><input type="number" id="rad0" value="0" min="0"></div>
            <div class="corner-input-wrap" data-corner="1"><label>Corner 2 (Btm R)</label><input type="number" id="rad1" value="0" min="0"></div>
            <div class="corner-input-wrap" data-corner="2"><label>Corner 3 (Top R)</label><input type="number" id="rad2" value="0" min="0"></div>
            <div class="corner-input-wrap" data-corner="3"><label>Corner 4 (Top L)</label><input type="number" id="rad3" value="0" min="0"></div>
        </div>
      </div>
      <div class="edge-controls panel">
        <h3>Edge Banding</h3>
        <div id="dynamic-banding-controls" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 15px; align-items: center;"></div>
      </div>
    </div>
  </div>
</div>
<div id="versionLabel">v4.6.0</div>
<script src="script.js"></script>
</body>
</html>
